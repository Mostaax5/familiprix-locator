name: PostgreSQL integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: locator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d locator_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest==8.4.2
      - run: python -m pytest -q tests/test_postgres_integration.py
        env:
          TEST_POSTGRES_URL: postgresql://test:local-test-only@localhost:5432/locator_test
          APP_START_SERVICES: "0"
