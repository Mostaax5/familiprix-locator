# Render's free tier spins the app down after ~15 idle minutes; the next visitor
# then waits ~1 minute for a cold start ("the app takes forever to load").
# Ping every 10 minutes AROUND THE CLOCK: one always-on service uses ~744 of the
# 750 free instance hours per month, so there is no reason to let it sleep — the
# store-hours-only window made every night-time work session start with a cold
# minute.
name: Keep Render app warm

permissions:
  contents: read

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the app
        run: curl -fsS --max-time 90 https://familiprix-locator.onrender.com/healthz > /dev/null || true
