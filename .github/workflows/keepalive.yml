# Render's free tier spins the app down after ~15 idle minutes; the next visitor
# then waits ~1 minute for a cold start ("the app takes forever to load").
# This pings the app every 10 minutes during store hours (Quebec ≈ 07:00-22:00
# local ≈ 11:00-02:00 UTC) so it stays warm when employees need it, and sleeps
# overnight to conserve Render's free instance hours.
name: Keep Render app warm

on:
  schedule:
    - cron: "*/10 11-23 * * *"   # 11:00-23:59 UTC
    - cron: "*/10 0-1 * * *"     # 00:00-01:59 UTC (evening in Quebec)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the app
        run: curl -sS --max-time 90 https://familiprix-locator.onrender.com/api/system/info > /dev/null || true
