name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install application
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest==8.4.2
      - name: Python tests
        run: python -m pytest -q -p no:cacheprovider tests
      - name: JavaScript tests
        shell: bash
        run: |
          for test_file in tests/*.js; do
            node "$test_file"
          done
      - name: Install browser verification dependencies
        run: |
          npm install --prefix /tmp/locator-browser --no-package-lock --no-save playwright@1.62.1
          /tmp/locator-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Employee workflow in a real browser
        run: node tests/e2e_employee_accounts.cjs
        env:
          NODE_PATH: /tmp/locator-browser/node_modules
          TEST_PYTHON: python

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build non-root store container
        run: docker build -t locator-test .
      - name: Verify bootstrap and HTTP readiness
        shell: bash
        run: |
          docker run -d --name locator-smoke -p 127.0.0.1:10000:10000 \
            -e STORE_ID=ci-store -e STORE_NAME='CI store' \
            -e APP_EXTERNAL_URL=http://localhost:10000 -e AUTH_COOKIE_SECURE=0 \
            -e INIT_OWNER_PASSWORD='Disposable CI owner password 2026!' locator-test
          trap 'docker logs locator-smoke; docker rm -f locator-smoke' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:10000/livez >/dev/null; then
              curl -fsS http://localhost:10000/api/auth/status | python -c 'import json,sys; assert json.load(sys.stdin)["account_mode"]'
              test "$(docker exec locator-smoke id -u)" = 10001
              exit 0
            fi
            sleep 2
          done
          exit 1
