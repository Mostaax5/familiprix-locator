name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install application
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest==8.4.2
      - name: Python tests
        run: python -m pytest -q -p no:cacheprovider tests
      - name: JavaScript tests
        shell: bash
        run: |
          for test_file in tests/*.js; do
            node "$test_file"
          done
