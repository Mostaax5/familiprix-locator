services:
  - type: web
    name: familiprix-locator
    env: python
    buildCommand: pip install -r requirements.txt
    # Server tuning lives in gunicorn.conf.py (auto-loaded); command-line flags
    # would silently override it, so keep the start command bare.
    startCommand: gunicorn app:app
    # Keep the previous revision live until PostgreSQL and the employee-search
    # corpus are ready. /healthz mirrors the same core readiness for existing
    # services whose dashboard still retains the older probe path.
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    plan: free
    envVars:
      # Keep the four-thread worker from retaining one large glibc allocation
      # arena per thread after catalogue and PDF work has finished.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: APP_PASSWORD_HASH
        sync: false
      - key: KIMI_API_KEY
        sync: false
      # Used only for multilingual catalogue embeddings. Kimi remains the
      # answer model; pgvector stores these embeddings persistently in Aiven.
      - key: GEMINI_API_KEY
        sync: false
      - key: SEMANTIC_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: KIMI_MODEL
        value: kimi-k2.6
      - key: KIMI_REALTIME_MODEL
        value: kimi-k2.6
      - key: KIMI_PLANNER_MODEL
        value: moonshot-v1-8k
      - key: KIMI_DOCUMENTED_MODEL
        value: kimi-k3
      - key: KIMI_REALTIME_REASONING_EFFORT
        value: low
      - key: KIMI_SYNC_DOCUMENTED_REASONING_EFFORT
        value: low
      - key: AI_DOCUMENTED_REQUEST_TIMEOUT
        value: "15"
