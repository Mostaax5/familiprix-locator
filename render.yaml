services:
  - type: web
    name: familiprix-locator
    env: python
    buildCommand: pip install -r requirements.txt
    # Server tuning lives in gunicorn.conf.py (auto-loaded); command-line flags
    # would silently override it, so keep the start command bare.
    startCommand: gunicorn app:app
    # Keep the previous revision live until PostgreSQL and the employee-search
    # corpus are ready. /healthz remains the dependency-free liveness probe.
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    plan: free
    envVars:
      # Keep the four-thread worker from retaining one large glibc allocation
      # arena per thread after catalogue and PDF work has finished.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: APP_PASSWORD_HASH
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: KIMI_MODEL
        value: kimi-k3
      - key: KIMI_REALTIME_MODEL
        value: kimi-k3
      - key: KIMI_DOCUMENTED_MODEL
        value: kimi-k3
      - key: KIMI_REALTIME_REASONING_EFFORT
        value: low
      - key: KIMI_SYNC_DOCUMENTED_REASONING_EFFORT
        value: low
      - key: AI_DOCUMENTED_REQUEST_TIMEOUT
        value: "15"
