services:
  - type: web
    name: familiprix-locator
    env: python
    buildCommand: pip install -r requirements.txt
    # Server tuning lives in gunicorn.conf.py (auto-loaded); command-line flags
    # would silently override it, so keep the start command bare.
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    plan: free
    envVars:
      - key: APP_PASSWORD_HASH
        sync: false
